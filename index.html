<index.html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>웹 OCR 재고 검색기</title>
    
    <link rel="manifest" href="data:application/manifest+json,{%22name%22:%22재고검색기%22,%22short_name%22:%22재고검색%22,%22start_url%22:%22.%22,%22display%22:%22standalone%22,%22background_color%22:%22%23ffffff%22,%22theme_color%22:%22%234CAF50%22}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="재고검색기">

    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

    <style>
        :root { --primary-color: #4CAF50; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; background-color: #f5f5f5; color: #333; }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 25px; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h3 { margin-top: 0; color: #34495e; border-left: 4px solid var(--primary-color); padding-left: 10px; }
        input[type="file"] { display: none; }
        .btn { display: block; width: 100%; padding: 12px; background: var(--primary-color); color: white; text-align: center; border-radius: 8px; font-weight: bold; cursor: pointer; border: none; box-sizing: border-box; font-size: 16px; }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        #preview { max-width: 100%; max-height: 250px; border-radius: 8px; margin: 15px auto 0; display: none; object-fit: contain; }
        .status { margin-top: 10px; font-size: 14px; color: #666; text-align: center; }
        #result-box { background: #edf2f7; padding: 15px; border-radius: 8px; font-family: monospace; white-space: pre-wrap; word-break: break-all; margin-top: 10px; font-size: 15px; border: 1px solid #cbd5e0; }
        .highlight { color: #e53e3e; font-weight: bold; }
    </style>
</head>
<body>

    <h2>📦 모바일 재고 검색기 (OCR)</h2>

    <div class="card">
        <h3>1. 재고 엑셀 파일 선택</h3>
        <label for="excel-file" class="btn">📁 엑셀 파일 불러오기</label>
        <input type="file" id="excel-file" accept=".xlsx, .xls">
        <div id="excel-status" class="status">아직 로드된 파일이 없습니다.</div>
    </div>

    <div class="card">
        <h3>2. 상품 글자 촬영</h3>
        <label for="camera-input" id="camera-label" class="btn" style="background: #3182ce;">📷 카메라 열기 / 사진 선택</label>
        <input type="file" id="camera-input" accept="image/*" capture="environment">
        <img id="preview" alt="촬영된 이미지">
        <div id="ocr-status" class="status"></div>
    </div>

    <div class="card">
        <h3>3. 검색 결과</h3>
        <div id="result-box">재고 파일을 먼저 등록하고 사진을 찍어주세요.</div>
    </div>

    <script>
        let inventoryData = [];

        // 서비스 워커 등록 (오프라인 작동 및 PWA 설치 환경 제공)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('data:text/javascript,self.addEventListener("fetch",()=>{"/*무조건통과*/"});');
            });
        }

        // [1] 엑셀 파일 로드 및 파싱
        document.getElementById('excel-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            document.getElementById('excel-status').innerText = "⏳ 엑셀 분석 중...";
            
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    inventoryData = XLSX.utils.sheet_to_json(worksheet);
                    
                    document.getElementById('excel-status').innerHTML = `✅ <b>로드 완료:</b> 총 ${inventoryData.length}개의 품목`;
                    document.getElementById('result-box').innerText = "사진을 찍으면 이곳에 결과가 나옵니다.";
                } catch (error) {
                    document.getElementById('excel-status').innerText = "❌ 엑셀 읽기 실패. 파일 형식을 확인하세요.";
                }
            };
            reader.readAsArrayBuffer(file);
        });

        // [2] 카메라 촬영 및 텍스트 인식 (OCR)
        document.getElementById('camera-input').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            // 이미지 미리보기 표시
            const preview = document.getElementById('preview');
            preview.src = URL.createObjectURL(file);
            preview.style.display = 'block';

            const ocrStatus = document.getElementById('ocr-status');
            ocrStatus.innerHTML = "🔄 <b>글자 인식 중...</b> (약 3~5초 소요)";
            document.getElementById('result-box').innerText = "";

            // Tesseract.js 실행 (한국어 + 영어 동시 분석)
            Tesseract.recognize(file, 'kor+eng')
            .then(({ data: { text } }) => {
                ocrStatus.innerHTML = "✅ <b>인식 성공!</b>";
                searchInventory(text);
            }).catch(err => {
                console.error(err);
                ocrStatus.innerHTML = "❌ <b>인식 실패</b> 다시 시도해주세요.";
            });
        });

        // [3] 재고 데이터 내 검색 알고리즘
        function searchInventory(extractedText) {
            // 비교를 위해 공백 제거 및 대문자화
            const cleanOCRText = extractedText.replace(/\s+/g, '').toUpperCase();
            
            if (!cleanOCRText) {
                document.getElementById('result-box').innerText = "❌ 사진에서 글자를 인식하지 못했습니다.";
                return;
            }

            // 엑셀 내 모든 행을 탐색
            const matchedItems = inventoryData.filter(item => {
                return Object.values(item).some(val => {
                    const strVal = String(val).replace(/\s+/g, '').toUpperCase();
                    // 너무 짧은 텍스트(예: 1글자 단위)로 오매칭되는 것 방지
                    return strVal.length > 1 && cleanOCRText.includes(strVal);
                });
            });

            const resultBox = document.getElementById('result-box');
            if (matchedItems.length > 0) {
                let output = `📸 <b>인식된 글자:</b>\n"${extractedText.trim()}"\n\n🎯 <b>매칭된 재고 정보 (${matchedItems.length}건):</b>\n`;
                matchedItems.forEach((item, index) => {
                    output += `\n[품목 ${index + 1}]\n`;
                    for (const [key, value] of Object.entries(item)) {
                        output += `• ${key}: ${value}\n`;
                    }
                });
                resultBox.innerHTML = output;
            } else {
                resultBox.innerHTML = `📸 <b>인식된 글자:</b>\n"${extractedText.trim()}"\n\n❌ <b>결과 없음:</b> 일치하는 모델명이나 코드가 엑셀에 없습니다.`;
            }
        }
    </script>
</body>
</html>
